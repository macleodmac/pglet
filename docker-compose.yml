services:
  postgres:
    image: postgres:17
    container_name: pglet-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pglet
      POSTGRES_PASSWORD: pglet
      POSTGRES_DB: demo
    volumes:
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - pglet-data:/var/lib/postgresql/data

volumes:
  pglet-data:
